<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Easy App Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      width: 90%;
      max-width: 500px;
      background: rgba(0,0,0,0.4);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    } <button id="sendPromptBtn">Send Prompt</button>
    h1 {
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      border: none;
      padding: 10px;
      font-size: 14px;
      resize: none;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00c6ff;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #00a2d6;
    }
    p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Easy App Builder</h1>
    <p>Describe your app. No coding needed.</p>

    <textarea placeholder="Example: Make a TikTok like app with chat, gifts, live and monetization..."></textarea>

    <button>Generate My App</button>

    <p>Powered by AI • Build apps with prompts</p>
  </div>

</body>
</html><!-- test --><!-- آپ کا باقی HTML content یہاں ہوگا -->

<script>
  // اپنا API key یہاں ڈالیں
  const OPENAI_API_KEY = "اپنی-API-KEY-یہاں";

  let responseContainer = document.getElementById("ai-response");
  if(!responseContainer){
      responseContainer = document.createElement("div");
      responseContainer.id = "ai-response";
      responseContainer.style.padding = "10px";
      responseContainer.style.border = "1px solid #ccc";
      responseContainer.style.marginTop = "20px";
      responseContainer.style.background = "#f9f9f9";
      document.body.appendChild(responseContainer);
  }

  async function generateResponse(promptText) {
    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-5.2-mini",
          messages: [{role: "user", content: promptText}],
          max_tokens: 500
        })
      });

      const data = await response.json();
      const result = data.choices[0].message.content;
      responseContainer.innerText = result;
    } catch (err) {
      responseContainer.innerText = "Error: " + err.message;
      console.error(err);
    }
  }

  // Promt یہاں لکھیں
  const myPrompt = "Easy App Builder: یوزرز کو بغیر کوڈنگ اپنی موبائل ایپ بنانے اور کنٹرول کرنے کی مکمل سہولت دیتا ہے۔";

  // Response generate کریں
  generateResponse(myPrompt);
</script>
<script>
document.getElementById("sendPromptBtn").addEventListener("click", async function() {
    const promptText = "ہیلو، مجھے میری ایپ کے لیے ڈیزائن بتاؤ";

    const response = await fetch("https://api.openai.com/v1/responses", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${process.env.OPENAI_KEY}` // GitHub secret یہاں استعمال ہوگا
        },
        body: JSON.stringify({
            model: "gpt-5-mini",
            input: promptText
        })
    });

    const data = await response.json();
    alert(data.output_text); // response ویب سائٹ پر دکھائے
});
</script>

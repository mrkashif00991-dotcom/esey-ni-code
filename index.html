<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Easy App Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      width: 90%;
      max-width: 500px;
      background: rgba(0,0,0,0.4);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      border: none;
      padding: 10px;
      font-size: 14px;
      resize: none;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00c6ff;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #00a2d6;
    }
    p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Easy App Builder</h1>
    <p>Describe your app. No coding needed.</p>

    <textarea placeholder="Example: Make a TikTok like app with chat, gifts, live and monetization..."></textarea>

    <button>Generate My App</button>

    <p>Powered by AI • Build apps with prompts</p>
  </div>

</body>
</html><!-- test -->
